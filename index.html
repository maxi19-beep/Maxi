<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nigeria Live Map & GPS Tracer</title>
  
  <!-- Leaflet CSS for Map Styling -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Tailwind CSS for Responsive Mobile UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #map {
      height: 100vh;
      width: 100vw;
      z-index: 1;
    }
  </style>
</head>
<body class="bg-gray-900 font-sans">

  <!-- TOP APP HEADER -->
  <div class="fixed top-4 left-4 right-4 z-20 max-w-md mx-auto bg-white/90 backdrop-blur-md p-3 rounded-2xl shadow-xl flex items-center justify-between border border-gray-200">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold text-lg shadow-md">
        <i class="fa-solid fa-location-dot"></i>
      </div>
      <div>
        <h1 class="text-sm font-extrabold text-gray-900">Nigeria GPS Tracker</h1>
        <p id="status-text" class="text-[11px] font-medium text-emerald-600 animate-pulse">Locating your phone...</p>
      </div>
    </div>
    <button onclick="locateUser()" class="w-10 h-10 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 flex items-center justify-center transition-all">
      <i class="fa-solid fa-arrows-rotate"></i>
    </button>
  </div>

  <!-- MAIN MAP DISPLAY CONTAINER -->
  <div id="map"></div>

  <!-- FLOATING ACTION BUTTONS -->
  <div class="fixed bottom-6 right-4 z-20 flex flex-col gap-3">
    <!-- Recenter on My Location -->
    <button onclick="locateUser()" title="My Location" class="w-12 h-12 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full shadow-2xl flex items-center justify-center text-lg active:scale-95 transition-all">
      <i class="fa-solid fa-crosshairs"></i>
    </button>
  </div>

  <!-- LEAFLET MAP JAVASCRIPT -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // Initializing Map centered on Nigeria (Default: Abuja [9.0765, 7.3986])
    const defaultCoords = [9.0765, 7.3986];
    const map = L.map('map', { zoomControl: false }).setView(defaultCoords, 6);

    // Zoom controls at bottom left
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    // 1. Standard Road Map Layer (OpenStreetMap - Continually updated with new Nigerian roads)
    const roadMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 2. Satellite Map Layer (Esri World Imagery)
    const satelliteMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Tiles © Esri'
    });

    // 3. Terrain / Topographic Map Layer
    const terrainMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
      attribution: 'Map data: © OpenStreetMap, SRTM | Map style: © OpenTopoMap'
    });

    // Layer Switcher Control (Top Right)
    const baseMaps = {
      "Road Map": roadMap,
      "Satellite": satelliteMap,
      "Terrain": terrainMap
    };
    L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

    let userMarker = null;
    let accuracyCircle = null;

    // FUNCTION TO GET LIVE PHONE LOCATION
    function locateUser() {
      const statusText = document.getElementById('status-text');
      statusText.textContent = "Fetching phone GPS...";
      statusText.className = "text-[11px] font-medium text-amber-600 animate-pulse";

      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser/phone.");
        statusText.textContent = "GPS Not Supported";
        statusText.className = "text-[11px] font-medium text-red-600";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          const userCoords = [lat, lng];

          // Move Map view to current GPS location
          map.flyTo(userCoords, 16, { animate: true, duration: 1.5 });

          // Remove previous marker/circle if existing
          if (userMarker) map.removeLayer(userMarker);
          if (accuracyCircle) map.removeLayer(accuracyCircle);

          // Add blue accuracy circle
          accuracyCircle = L.circle(userCoords, {
            radius: accuracy,
            color: '#059669',
            fillColor: '#10b981',
            fillOpacity: 0.15
          }).addTo(map);

          // Custom Marker Icon
          const customIcon = L.divIcon({
            className: 'custom-pin',
            html: `<div class="w-6 h-6 bg-emerald-600 border-2 border-white rounded-full shadow-lg flex items-center justify-center text-white text-xs"><i class="fa-solid fa-circle"></i></div>`,
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });

          // Add User Location Marker with Popup Information
          userMarker = L.marker(userCoords, { icon: customIcon }).addTo(map)
            .bindPopup(`
              <div class="p-1">
                <strong class="text-xs text-gray-900">Your Current Location</strong><br>
                <span class="text-[11px] text-gray-600">Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}</span><br>
                <span class="text-[10px] text-emerald-600 font-bold">Accuracy: ±${Math.round(accuracy)}m</span>
              </div>
            `)
            .openPopup();

          statusText.textContent = "Live GPS Active";
          statusText.className = "text-[11px] font-medium text-emerald-600";
        },
        (error) => {
          console.error("GPS Error:", error);
          statusText.textContent = "GPS Access Denied";
          statusText.className = "text-[11px] font-medium text-red-600";
          alert("Could not get your location. Please turn on Location/GPS permissions on your phone browser.");
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // Auto-fetch location on initial load
    window.onload = locateUser;
  </script>
</body>
</html>
