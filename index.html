<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Style Interactive Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            background-color: #aadaff; /* Snapchat sky/water blue tint */
        }

        /* Custom Snapchat Style Tooltips / Labels */
        .snap-label {
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 20px;
            padding: 5px 12px;
            font-weight: 700;
            font-size: 13px;
            color: #111;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }

        .snap-label::before {
            display: none; /* Hide default leaflet arrow */
        }

        /* Custom Marker Pins */
        .map-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #FFFC00; /* Snapchat Yellow */
            border: 3px solid #000;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .map-pin:hover {
            transform: scale(1.2);
        }

        .house-pin { background: #ff7675; }
        .tree-pin { background: #55efc4; }
        .building-pin { background: #74b9ff; }

        /* Floating UI Header */
        .ui-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border: 2px solid #000;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="ui-header">
        <span>📍 Snap-Style Map</span>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialize the map centered at your location (default set to Lagos / generic coordinates)
        const map = L.map('map', {
            zoomControl: false
        }).setView([6.5244, 3.3792], 16); // Latitude, Longitude, Zoom Level

        // Add custom zoom control position
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 2. Add Vector Tile style (CartoDB Voyager - clean, colorful Snapchat vibe showing roads & buildings clearly)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // 3. Helper function to create custom emoji markers
        function createCustomIcon(emoji, typeClass) {
            return L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="map-pin ${typeClass}">${emoji}</div>`,
                iconSize: [44, 44],
                iconAnchor: [22, 22]
            });
        }

        // 4. Sample Map Data (Houses, Trees, Buildings, and Roads)
        const locations = [
            {
                name: "My House 🏡",
                type: "house",
                emoji: "🏠",
                class: "house-pin",
                coords: [6.5250, 3.3785],
                description: "Residential area with family house and garden."
            },
            {
                name: "Central Park & Big Tree 🌳",
                type: "tree",
                emoji: "🌳",
                class: "tree-pin",
                coords: [6.5235, 3.3800],
                description: "Green park area filled with tropical trees."
            },
            {
                name: "Tech Tower Plaza 🏢",
                type: "building",
                emoji: "🏢",
                class: "building-pin",
                coords: [6.5260, 3.3810],
                description: "Commercial multi-storey office building."
            },
            {
                name: "Main Express Road 🛣️",
                type: "road",
                emoji: "🚗",
                class: "house-pin",
                coords: [6.5240, 3.3770],
                description: "Connecting highway road."
            }
        ];

        // 5. Add elements and floating persistent labels to the map
        locations.forEach(loc => {
            // Add Marker
            const marker = L.marker(loc.coords, {
                icon: createCustomIcon(loc.emoji, loc.class)
            }).addTo(map);

            // Add Permanent Floating Label (Snapchat Style)
            marker.bindTooltip(loc.name, {
                permanent: true,
                direction: 'top',
                offset: [0, -20],
                className: 'snap-label'
            });

            // Add Click Popup Details
            marker.bindPopup(`
                <div style="text-align: center; padding: 5px;">
                    <h3 style="margin-bottom: 5px;">${loc.name}</h3>
                    <p>${loc.description}</p>
                </div>
            `);
        });

        // 6. Optional: Click anywhere on map to add your own custom place
        map.on('click', function(e) {
            const name = prompt("Enter name for this new location (House, Tree, Road, etc.):");
            if (name) {
                const newMarker = L.marker(e.latlng, {
                    icon: createCustomIcon("📍", "house-pin")
                }).addTo(map);

                newMarker.bindTooltip(name, {
                    permanent: true,
                    direction: 'top',
                    offset: [0, -20],
                    className: 'snap-label'
                });

                newMarker.bindPopup(`<b>${name}</b><br>Latitude: ${e.latlng.lat.toFixed(4)}<br>Longitude: ${e.latlng.lng.toFixed(4)}`);
            }
        });
    </script>
</body>
</html>
